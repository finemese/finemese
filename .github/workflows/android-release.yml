name: Build Fine Mese Android release bundle

on:
  workflow_dispatch:
  push:
    branches:
      - work/mobile-build-automation

permissions:
  contents: read

jobs:
  android-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Prepare web assets
        run: npm run copy:web

      - name: Add Android platform if missing
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build release APK and Android App Bundle
        working-directory: android
        run: ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Upload unsigned release packages
        uses: actions/upload-artifact@v4
        with:
          name: finemese-android-release-unsigned
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
